<!DOCTYPE html>
<html>
<head>
    <title>Calculator App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 80px;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
        }
        .result {
            margin-top: 20px;
            font-size: 22px;
            color: green;
        }
    </style>
</head>
<body>

<h2>Calculator Web Application</h2>

<form method="POST" action="/calculate">
    <input type="number" step="any" name="num1" value="{{ num1 or '' }}" required>
    <input type="number" step="any" name="num2" value="{{ num2 or '' }}" required>
    <br>

    <button type="submit" name="operation" value="add">+</button>
    <button type="submit" name="operation" value="sub">−</button>
    <button type="submit" name="operation" value="mul">×</button>
    <button type="submit" name="operation" value="div">÷</button>
</form>

{% if result is not none %}
<div class="result">
    Result: {{ result }}
</div>
{% endif %}

</body>
</html>
